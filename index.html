<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BarkerBox - Subscribe and Save 15%</title>

    <!-- Connect the CSS file -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main subscription container -->
    <div class="container">

        <!-- Dog image -->
        <div class="dog-image">
            <img src="dog.png" alt="BarkerBox Happy Dog">
        </div>

        <!-- Main heading -->
        <h1>BarkerBox - Subscribe and Save 15%</h1>

        <!-- Product description -->
        <p>
            Discover a monthly subscription box that brings an assortment
            of unique, playful, and durable toys that dogs will love.
            Subscribe now and enjoy exclusive benefits!
        </p>

        <!-- Registration form -->
        <form>

            <!-- Name input -->
            <input
                type="text"
                placeholder="Enter your name"
                required
            >

            <!-- Email input -->
            <input
                type="email"
                placeholder="Enter your email"
                required
            >

            <!-- Submit button -->
            <button type="submit">Get My 15% Off</button>

        </form>

    </div>

</body>
</html>
